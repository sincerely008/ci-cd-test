services:
  app:
    image: ${IMAGE:?Set IMAGE to the published container image and tag}
    container_name: ci-cd-test
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0}
    volumes:
      - app-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

volumes:
  app-data:
    name: ${DATA_VOLUME_NAME:-ci-cd-test-data}
