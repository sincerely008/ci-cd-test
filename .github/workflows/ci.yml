name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests and package the application
        run: ./gradlew --no-daemon clean check bootJar

      - name: Build container image
        run: |
          docker build --tag ci-cd-test:ci .

      - name: Validate Docker Compose definition
        run: docker compose --env-file .env.ci -f compose.prod.yaml config --quiet

      - name: Verify application and PostgreSQL integration
        run: |
          docker compose --env-file .env.ci -p ci-e2e -f compose.prod.yaml up -d --wait --wait-timeout 120
          curl --fail --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:18080/actuator/health
          note_id="$(curl --fail --silent --show-error \
            --user ci-user:ci-test-app-password \
            --header 'Content-Type: application/json' \
            --data '{"content":"ci-postgres-integration"}' \
            http://127.0.0.1:18080/api/notes | jq --exit-status --raw-output '.id')"
          test -n "$note_id"
          curl --fail --silent --show-error \
            --user ci-user:ci-test-app-password \
            "http://127.0.0.1:18080/api/notes/$note_id" \
            | jq --exit-status '.content == "ci-postgres-integration"'

      - name: Clean up Compose integration test
        if: always()
        run: docker compose --env-file .env.ci -p ci-e2e -f compose.prod.yaml down -v --remove-orphans

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/reports/problems/
          if-no-files-found: ignore
          retention-days: 7
