name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'ci-cd-test' }}

jobs:
  publish:
    name: Build and publish container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.image.outputs.image }}
      registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate ECR configuration
        run: |
          test -n "${AWS_REGION}"
          test -n "${ECR_REPOSITORY}"

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          role-session-name: ci-cd-test-ecr-publish
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Select immutable image digest
        id: image
        run: echo "image=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ steps.build-image.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to production server
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    # Enable after configuring the production environment and its deployment secrets.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}

    steps:
      - name: Check out deployment manifest
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_HOST"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Copy deployment manifest
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_SECURITY_USER: ${{ secrets.APP_SECURITY_USER }}
          APP_SECURITY_PASSWORD: ${{ secrets.APP_SECURITY_PASSWORD }}
        run: |
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          test -n "$POSTGRES_DB"
          test -n "$POSTGRES_USER"
          test -n "$POSTGRES_PASSWORD"
          test -n "$APP_SECURITY_USER"
          test -n "$APP_SECURITY_PASSWORD"
          ssh -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          scp -P "${DEPLOY_PORT:-22}" compose.prod.yaml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/compose.prod.yaml"

      - name: Write protected runtime environment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_SECURITY_USER: ${{ secrets.APP_SECURITY_USER }}
          APP_SECURITY_PASSWORD: ${{ secrets.APP_SECURITY_PASSWORD }}
        run: |
          runtime_env="$(printf 'POSTGRES_DB=%s\nPOSTGRES_USER=%s\nPOSTGRES_PASSWORD=%s\nAPP_SECURITY_USER=%s\nAPP_SECURITY_PASSWORD=%s\n' "$POSTGRES_DB" "$POSTGRES_USER" "$POSTGRES_PASSWORD" "$APP_SECURITY_USER" "$APP_SECURITY_PASSWORD")"
          runtime_env_base64="$(printf '%s' "$runtime_env" | base64 | tr -d '\n')"
          ssh -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "umask 077 && printf '%s' '$runtime_env_base64' | base64 --decode > '$DEPLOY_PATH/.env' && chmod 600 '$DEPLOY_PATH/.env'"

      - name: Pull and restart application
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE: ${{ needs.publish.outputs.image }}
          ECR_REGISTRY: ${{ needs.publish.outputs.registry }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          APP_PORT: ${{ vars.APP_PORT || '8080' }}
        run: |
          ssh -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "IMAGE='$IMAGE' ECR_REGISTRY='$ECR_REGISTRY' AWS_REGION='$AWS_REGION' APP_PORT='$APP_PORT' DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          command -v aws >/dev/null
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          docker compose -f compose.prod.yaml pull
          docker compose -f compose.prod.yaml up -d --remove-orphans --wait --wait-timeout 120
          docker image prune --force
          REMOTE_SCRIPT
